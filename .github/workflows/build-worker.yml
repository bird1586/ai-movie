name: build-worker

on:
push:
  branches: [main]
  paths: ["worker/**", ".github/workflows/build-worker.yml"]
workflow_dispatch:

permissions:
contents: read
packages: write

concurrency:
group: build-worker-${{ github.ref }}
cancel-in-progress: true

env:
IMAGE: ghcr.io/${{ github.repository_owner }}/ai-movie-worker

jobs:
build:
  runs-on: ubuntu-latest
  timeout-minutes: 120
  steps:
    - uses: actions/checkout@v4

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: worker/Dockerfile

    # 託管 runner 只有約 14 GB 可用空間，torch + CUDA 層會塞爆
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h /

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Short SHA
      id: sha
      run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

    # GPUtw 不接受 latest，只推 commit SHA tag
    - uses: docker/build-push-action@v6
      with:
        context: worker
        platforms: linux/amd64
        push: true
        provenance: false
        tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

    - name: Report image size
      run: |
        docker buildx imagetools inspect "$IMAGE:${{ steps.sha.outputs.short }}" --raw \
          | jq '[.layers[]?.size] | add / 1e9 | "compressed: \(.*100|round/100) GB"' || true
